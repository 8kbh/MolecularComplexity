[project]
name = "mc"
version = "0.1.0"
requires-python = "~=3.10.0"
description = "Code for the paper 'Digitization of molecular complexity with machine learning'"
authors = [
    { name="Andrei Tyrin", email="tyrin.andr@gmail.com" }
]
dependencies = [
    "catboost>=1.2.8",
    "datamol>=0.12.5",
    "flask>=3.1.2",
    "flask-cors>=6.0.1",
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
    "scikit-learn==1.4.1.post1",
    "tqdm>=4.67.1",
]

[tool.setuptools]
packages = ["mc"]
